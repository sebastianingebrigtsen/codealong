name: Feature request
description: Suggest an idea or a site/editor to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like CodeAlong to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else? (alternatives, examples, links)
