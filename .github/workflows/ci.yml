name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned images: a runner image upgrade should be a deliberate change, not a surprise.
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Package (with development extension ID)
        run: npm run package -- --allow-dev-id

  e2e-chrome:
    name: Chrome extension in Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  e2e-vscode:
    # Pinned VS Code versions (e2e/vscode/versions.mjs): the oldest supported (= engines.vscode)
    # and the newest tested. New stable releases are covered by vscode-compat.yml, which never
    # blocks pull requests.
    name: VS Code extension in VS Code (${{ matrix.vscode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vscode: [minimum, latest-tested]
    env:
      CODEALONG_VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache VS Code download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ matrix.vscode }}-${{ hashFiles('e2e/vscode/versions.mjs') }}
      - run: npm run build
      - name: Run tests (virtual display)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node e2e/vscode/run.mjs
      - name: Upload VS Code logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-e2e-${{ matrix.vscode }}
          path: e2e/.artifacts/
          retention-days: 14
