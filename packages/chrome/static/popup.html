<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodeAlong</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header class="header">
      <img src="icons/32.png" width="20" height="20" alt="" />
      <h1>CodeAlong</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" role="switch" aria-describedby="enabled-hint" />
        <span class="switch-track" aria-hidden="true"></span>
        <span id="enabled-hint" class="visually-hidden">Turn CodeAlong on or off</span>
      </label>
    </header>

    <section class="card" aria-live="polite" aria-atomic="true">
      <p id="headline" class="headline">Loading…</p>
      <p id="detail" class="detail"></p>
    </section>

    <dl class="facts">
      <div>
        <dt>VS Code</dt>
        <dd id="vscode">–</dd>
      </div>
      <div>
        <dt>Tutorial</dt>
        <dd id="tutorial">None</dd>
      </div>
      <div>
        <dt>Video</dt>
        <dd id="video">–</dd>
      </div>
    </dl>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="actions">
      <button id="follow" type="button" class="primary">Follow this tab</button>
      <div class="row">
        <button id="toggle" type="button" title="Pause or play the tutorial (Alt+Shift+P)">Pause / Play</button>
        <button id="done" type="button" title="I'm done – continue the tutorial (Alt+Shift+D)">I'm done</button>
      </div>
    </div>

    <footer class="footer">
      <a href="welcome.html" target="_blank">How it works</a>
      <a id="privacy" href="#" target="_blank" rel="noopener">Privacy</a>
      <details>
        <summary>Troubleshooting</summary>
        <label class="check"><input type="checkbox" id="debug" /> Show event log</label>
        <ol id="log" class="log" aria-label="Recent CodeAlong events"></ol>
      </details>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
